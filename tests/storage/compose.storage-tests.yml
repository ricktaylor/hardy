# Infrastructure for storage integration tests.
#
# Start before running postgres/s3 tests:
#
#   docker compose -f tests/storage/compose.storage-tests.yml up -d --wait
#   docker compose -f tests/storage/compose.storage-tests.yml run --rm rustfs-init
#   TEST_POSTGRES_URL=postgresql://hardy:hardy@localhost:5432 \
#   TEST_S3_ENDPOINT=http://localhost:9000 \
#   AWS_ACCESS_KEY_ID=rustfsadmin \
#   AWS_SECRET_ACCESS_KEY=rustfsadmin \
#     cargo test -p storage-tests --features postgres,s3

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hardy
      POSTGRES_PASSWORD: hardy
      POSTGRES_DB: hardy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardy"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot that creates the test bucket; creating an existing bucket succeeds.
  # The profile keeps it out of `up --wait`, which expects long-running services.
  rustfs-init:
    image: amazon/aws-cli:2.37.4
    profiles: ["init"]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["aws", "--endpoint-url", "http://rustfs:9000", "s3api", "create-bucket", "--bucket"]
    command: ["hardy-test"]

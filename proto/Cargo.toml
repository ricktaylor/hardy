[package]
name = "hardy-proto"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dtn", "bpv7", "grpc", "protobuf", "tonic"]
categories = ["network-programming"]
exclude = ["docs/"]
description = "The gRPC wire contract of the Hardy BPA"

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
client = [
    "dep:hardy-async",
    "dep:hardy-bpa",
    "dep:hardy-bpv7",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tonic-types",
    "dep:time",
    "dep:tracing",
    "dep:hardy-eid-patterns",
]
instrument = ["tracing?/attributes"]
server = [
    "dep:dashmap",
    "dep:foldhash",
    "dep:rand",
    "dep:hardy-async",
    "dep:hardy-bpa",
    "dep:hardy-bpv7",
    "dep:thiserror",
    "dep:tokio",
    "tokio/time",
    "dep:tokio-stream",
    "dep:tonic-types",
    "dep:time",
    "dep:tracing",
    "dep:hardy-eid-patterns",
]

[dependencies]
dashmap = { version = "6", optional = true }
foldhash = { version = "0.2", optional = true }
hardy-async = { version = "0.2", path = "../async", optional = true }
hardy-bpa = { version = "0.2", path = "../bpa", default-features = false, features = ["tokio"], optional = true }
hardy-bpv7 = { version = "0.6", path = "../bpv7", optional = true }
hardy-eid-patterns = { version = "0.4", path = "../eid-patterns", default-features = false, features = ["dtn-pat-item", "std"], optional = true }
prost = "0.14"
prost-types = "0.14"
rand = { version = "0.10", optional = true }
thiserror = { version = "2", optional = true }
time = { version = "0.3", optional = true }
tokio = { version = "1", features = ["macros", "sync"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tonic = "0.14"
tonic-prost = "0.14"
tonic-types = { version = "0.14", optional = true }
tracing = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
hardy-bpa = { version = "0.2", path = "../bpa", default-features = false, features = [
    "tokio",
    "no-rfc9171-autoregister",
] }
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "test-util",
    "time",
] }

[build-dependencies]
tonic-prost-build = "0.14"

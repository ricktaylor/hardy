syntax = "proto3";

package hardy.application.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";

// Bundle Protocol application agent API.
//
// An application registers an endpoint on the BPA and exchanges
// RFC 9171 application data units (ADUs) with it.
//
// The registration lives in one Subscribe call, the session. Its
// first request is Register. Its first response is a Registration
// event carrying a session token. After that, the response stream
// carries only events. A BundleStatusReport is self-contained; a
// Delivery expects a Receive call back to collect its ADU. ADU bytes
// never travel on this stream.
//
// Every other RPC presents the session token in its first message.
// Send streams an ADU to the BPA and returns the bundle id. Receive
// collects the ADU of a Delivery and commits it with an ack.
//
// Unregister, or closing the Subscribe stream, ends the
// registration and invalidates the token. A Delivery left
// uncollected is pushed again to a later registration.
//
// A failed call ends with a gRPC status: a code and a short message,
// and nothing else. The code is what a client branches on; the message
// is a phrase for a developer reading a log, and never reflects
// anything the client sent. A status with a code this file does not
// name for the call came from the transport, not the BPA.
service ApplicationService {
  // -- Control plane ---------------------------------------------------

  // Establishes the session and registers the endpoint.
  //
  // The first request must be Register; the first response is a
  // Registration event carrying the session token. The stream then
  // carries only events. Unregister, or closing the stream, ends the
  // registration.
  rpc Subscribe(stream SubscribeRequest) returns (stream SubscribeResponse);

  // -- Data plane ------------------------------------------------------

  // Sends an ADU as a new bundle.
  //
  // The first message must be the metadata, which carries the
  // session token; the ADU follows as chunk messages ended by
  // last_chunk. A transfer that ends without last_chunk is
  // discarded.
  rpc Send(stream SendRequest) returns (SendResponse);

  // Receives the ADU of an earlier Delivery event.
  //
  // The first message must be the metadata, which carries the
  // session token; the ADU streams back as chunk messages ended by
  // last_chunk. Only an ack after last_chunk completes the delivery;
  // in every other case the BPA keeps the bundle and pushes a new
  // Delivery to a later registration. Each Delivery permits a single
  // Receive call.
  rpc Receive(stream ReceiveRequest) returns (stream ReceiveResponse);
}

// ---------------------------------------------------------------------
// Control plane: the session stream. Small messages only.
// ---------------------------------------------------------------------

// Request message for Subscribe.
message SubscribeRequest {
  // The request. Register must be the first message on the stream;
  // Unregister ends the registration.
  oneof request {
    // Opens the registration.
    Register   register   = 1;
    // Ends the registration.
    Unregister unregister = 2;
  }
}

// Registers an endpoint. Must be the first message on the stream.
message Register {
  // The service to register. If unset, the BPA assigns a free
  // service number.
  oneof service_id {
    // An ipn scheme service number.
    uint32 ipn = 1;
    // A dtn scheme demux string.
    string dtn = 2;
  }
  // The largest chunk this client wants to handle, in bytes. The
  // server replies with the chunk_size it agreed, never above this.
  // A value below 1024 fails with INVALID_ARGUMENT. If unset, the
  // server picks.
  optional uint64 max_chunk_size = 3;
}

// Ends the registration. Closing the request stream has the same
// effect.
message Unregister {}

// Response message for Subscribe. If registration fails, the
// Subscribe call itself fails with a gRPC status instead.
message SubscribeResponse {
  // The event. Registration is always the first; deliveries and
  // status reports follow in any order.
  oneof event {
    // The registration succeeded; carries the session token.
    Registration       registration         = 1;
    // An ADU is ready for collection.
    Delivery           delivery             = 2;
    // A status report for a bundle sent through this session.
    BundleStatusReport bundle_status_report = 3;
  }
}

// The result of a successful registration. Always the first event on
// the stream.
message Registration {
  // The registered endpoint id, e.g. "ipn:977000.42". Bundles sent
  // through this session use it as their source.
  string endpoint_id = 1;
  // The token that authenticates data-plane calls for this session.
  // Opaque; expires when the session stream closes.
  bytes  session_token = 2;
  // The sizes this session runs under.
  hardy.common.v1.Sizes sizes = 3;
}

// Announces an ADU ready for collection with Receive.
message Delivery {
  // The bundle id. See SendResponse.bundle_id for the encoding.
  string                    bundle_id     = 1;
  // The source endpoint id of the bundle.
  string                    source        = 2;
  // The expiry time of the bundle; the ADU is discarded afterwards.
  google.protobuf.Timestamp expire_time   = 3;
  // Whether the sender requested an application acknowledgement.
  bool                      ack_requested = 4;
  // The size of the ADU in bytes, as Receive will deliver it.
  uint64                    adu_size      = 5;
}

// A bundle status report for a bundle sent through this session.
// Informational only; no reply is expected.
message BundleStatusReport {
  // The subject bundle id. See SendResponse.bundle_id for the
  // encoding.
  string                             bundle_id      = 1;
  // The endpoint id of the reporting node.
  string                             reporting_node = 2;
  // The status being asserted.
  StatusAssertion                    assertion      = 3;
  // The RFC 9171 reason code for the assertion.
  uint64                             reason_code    = 4;
  // The time of the asserted event, if the reporting node included
  // it.
  optional google.protobuf.Timestamp status_time    = 5;
}

// The status asserted by a bundle status report (RFC 9171).
enum StatusAssertion {
  // No assertion; a report carrying it is malformed.
  STATUS_ASSERTION_UNSPECIFIED = 0;
  // The reporting node received the bundle.
  STATUS_ASSERTION_RECEIVED    = 1;
  // The reporting node forwarded the bundle.
  STATUS_ASSERTION_FORWARDED   = 2;
  // The reporting node delivered the bundle to its endpoint.
  STATUS_ASSERTION_DELIVERED   = 3;
  // The reporting node deleted the bundle; reason_code says why.
  STATUS_ASSERTION_DELETED     = 4;
}

// ---------------------------------------------------------------------
// Data plane: token-gated RPCs. ADU bytes move here.
// ---------------------------------------------------------------------

// A single message in the Send request stream.
message SendRequest {
  // The message. Metadata comes first, then chunks ended by
  // last_chunk; cancel may come at any point instead.
  oneof request {
    // Describes the ADU. Must be the first message.
    SendMetadata          metadata   = 1;
    // The next fragment of ADU data.
    bytes                 chunk      = 2;
    // Cancels the transfer; the partial ADU is discarded.
    google.protobuf.Empty cancel     = 3;
    // The final fragment of ADU data (possibly empty). Completes the
    // transfer.
    bytes                 last_chunk = 4;
  }
}

// Describes the ADU being sent. The first message of a Send call.
message SendMetadata {
  // The session token from Registration.
  bytes                    session_token = 1;
  // The destination endpoint id of the bundle.
  string                   destination   = 2;
  // The lifetime of the bundle. Required; a missing, negative, or
  // out-of-range value fails with INVALID_ARGUMENT.
  google.protobuf.Duration lifetime      = 3;
  // Optional transmission flags.
  optional SendOptions     options       = 4;
  // The size of the ADU in bytes, if declared. A declared size above
  // the server's transfer limit fails with RESOURCE_EXHAUSTED before
  // any byte moves; a transfer that ends at a different size fails
  // with INVALID_ARGUMENT. If unset, last_chunk alone delimits. The
  // server never allocates against the declaration.
  optional uint64          adu_size      = 5;
}

// Transmission flags for a single Send (RFC 9171). All default to
// false.
message SendOptions {
  // Forbids fragmentation of the bundle.
  bool do_not_fragment    = 1;
  // Requests an acknowledgement from the receiving application.
  bool app_ack_requested  = 2;
  // Requests that status reports include the event time.
  bool report_status_time = 3;
  // Requests a status report when the bundle is received.
  bool report_reception   = 4;
  // Requests a status report when the bundle is forwarded.
  bool report_forwarding  = 5;
  // Requests a status report when the bundle is delivered.
  bool report_delivery    = 6;
  // Requests a status report when the bundle is deleted.
  bool report_deletion    = 7;
}

// Response message for Send.
message SendResponse {
  // The id of the created bundle. Status reports reference it.
  //
  // A bundle id string is the RFC 9171 bundle id in canonical CBOR,
  // encoded as URL-safe unpadded base64 (RFC 4648 section 5). The
  // string is opaque: clients compare it byte-for-byte and pass it
  // back unchanged.
  string bundle_id = 1;
}

// A single message in the Receive request stream.
message ReceiveRequest {
  // The message. Metadata comes first; then either ack, once
  // last_chunk has arrived, or cancel.
  oneof request {
    // Identifies the delivery to collect. Must be the first message.
    ReceiveMetadata       metadata = 1;
    // Abandons the collection; the bundle remains held.
    google.protobuf.Empty cancel   = 2;
    // Completes the collection. Valid only after last_chunk.
    google.protobuf.Empty ack      = 3;
  }
}

// Identifies the delivery to collect. The first message of a Receive
// call.
message ReceiveMetadata {
  // The session token from Registration.
  bytes  session_token = 1;
  // The bundle id from the Delivery event.
  string bundle_id     = 2;
}

// A single message in the Receive response stream.
message ReceiveResponse {
  // Field 2 once carried a server-side cancellation, which is now a
  // status on the call.
  reserved 2;

  // The message: chunks ended by last_chunk.
  oneof response {
    // The next fragment of ADU data.
    bytes chunk      = 1;
    // The final fragment of ADU data (possibly empty).
    bytes last_chunk = 3;
  }
}

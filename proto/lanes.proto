syntax = "proto3";

import "google/protobuf/empty.proto";

package lanes;

// A registrant's lanes: its honest parallelism, how many hand-offs it can
// usefully take in flight at once — transfers to one peer for a CLA,
// deliveries for a service or application. The BPA bounds every
// declaration by its own seat cap. Corresponds to hardy_bpa::lanes::Lanes.
//
// A registration that omits its `Lanes` field declares serial, the same as
// `serial`.
message Lanes {
  oneof kind {
    // One hand-off at a time, in queue order.
    google.protobuf.Empty serial    = 1;
    // Up to this many hand-offs at once. An explicit 0 is invalid and the
    // registration is rejected.
    uint32                limited   = 2;
    // No limit of the registrant's own: as many as the BPA allows.
    google.protobuf.Empty unlimited = 3;
  }
}

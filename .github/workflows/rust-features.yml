name: Rust Features
# Cargo unifies features across the workspace, so the --workspace builds
# in rust.yml never compile a crate with a sparse feature set: a crate
# whose `client` feature does not build alone still passes every other
# job. cargo-hack builds each crate with no features, each feature
# alone, and every feature pair, i.e. what a downstream consumer with
# `default-features = false` actually gets. (The all-features build is
# already covered by every job in rust.yml.)
#
# The trigger paths are the closed dependency cone of the checked crates
# (cbor <- bpv7 <- eid-patterns <- bpa <- proto, plus async): a change
# anywhere else in the workspace cannot affect their sparse builds. The
# feature-changes job then narrows the sweep to the crates the PR can
# actually affect.
#
# NOTE: if the `features` job ever becomes a required check, fold this
# workflow into rust.yml behind the same paths filter: a job skipped by
# an `if:` satisfies branch protection, but a workflow never triggered
# by `paths:` leaves the PR waiting on an "Expected" status.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "cbor/**"
      - "bpv7/**"
      - "eid-patterns/**"
      - "async/**"
      - "bpa/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-features.yml"
      - ".github/actions/**"

permissions:
  contents: read

concurrency:
  group: ci-features-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: "29.3"

jobs:
  # Which crates need a cargo-hack sweep for this PR. Each filter lists
  # the crate's own directory PLUS its path dependencies within the
  # workspace: a feature change in a dependency can break a dependent's
  # sparse builds, so the dependent must re-run too. Keep the lists in
  # sync with the crates' Cargo.toml [dependencies].
  feature-changes:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workspace: &workspace
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/rust-features.yml'
            cbor:
              - *workspace
              - 'cbor/**'
            bpv7:
              - *workspace
              - 'cbor/**'
              - 'bpv7/**'
            eid-patterns:
              - *workspace
              - 'cbor/**'
              - 'bpv7/**'
              - 'eid-patterns/**'
            async:
              - *workspace
              - 'async/**'
            bpa:
              - *workspace
              - 'cbor/**'
              - 'bpv7/**'
              - 'eid-patterns/**'
              - 'async/**'
              - 'bpa/**'
            proto:
              - *workspace
              - 'cbor/**'
              - 'bpv7/**'
              - 'eid-patterns/**'
              - 'async/**'
              - 'bpa/**'
              - 'proto/**'

  features:
    runs-on: ubuntu-latest
    needs: feature-changes
    if: needs.feature-changes.outputs.crates != '[]'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Use cached dependencies and artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: features

      - name: Setup protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      # hardy-async and hardy-bpa do not yet compile without `tokio`
      # (see rust.yml's no-std job TODO), so they sweep with `tokio`
      # pinned on and every remaining feature checked on top of it; the
      # others sweep unrestricted.
      # TODO: merge the two lists once their --no-default-features
      # builds are clean.
      - name: Select changed crates
        id: pkgs
        run: |
          plain=""
          tokio=""
          for crate in $(echo '${{ needs.feature-changes.outputs.crates }}' | jq -r '.[]'); do
            case "$crate" in
              cbor)         plain="$plain -p hardy-cbor" ;;
              bpv7)         plain="$plain -p hardy-bpv7" ;;
              eid-patterns) plain="$plain -p hardy-eid-patterns" ;;
              proto)        plain="$plain -p hardy-proto" ;;
              async)        tokio="$tokio -p hardy-async" ;;
              bpa)          tokio="$tokio -p hardy-bpa" ;;
            esac
          done
          echo "plain=$plain" >> "$GITHUB_OUTPUT"
          echo "tokio=$tokio" >> "$GITHUB_OUTPUT"

      # --feature-powerset --depth 2 checks no features, each feature
      # alone, and every pair, so a failure needing two features together
      # is caught, not just a feature that fails alone. --no-dev-deps
      # checks the crate as a dependency (dev-deps can mask missing
      # feature declarations); it temporarily rewrites Cargo.toml, which
      # is incompatible with --locked; lockfile integrity is already
      # enforced by rust.yml's `checks` job. RUSTFLAGS promotes warnings
      # to errors: sparse configurations are built nowhere else, so a
      # warning-only defect here would otherwise land unseen.
      - name: Check feature combinations
        if: steps.pkgs.outputs.plain != ''
        env:
          RUSTFLAGS: -D warnings
        run: >
          cargo hack check --feature-powerset --depth 2 --no-dev-deps
          ${{ steps.pkgs.outputs.plain }}

      - name: Check feature combinations (tokio pinned)
        if: steps.pkgs.outputs.tokio != ''
        env:
          RUSTFLAGS: -D warnings
        run: >
          cargo hack check --feature-powerset --depth 2 --features tokio
          --no-dev-deps ${{ steps.pkgs.outputs.tokio }}

[package]
name = "hardy-btpu"
description = "Bundle Transfer Protocol - Unidirectional (BTP-U) codec and transfer logic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dtn", "bpv7", "btpu", "convergence-layer", "unidirectional"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
serde = ["dep:serde"]
rand = ["dep:rand_core"]
tower = ["dep:tower", "dep:futures-core"]
# Enable this feature on targets without native atomic CAS instructions (e.g., thumbv6m / Cortex-M0).
# Requires a critical-section implementation - see https://docs.rs/portable-atomic
critical-section = ["bytes/extra-platforms", "dep:portable-atomic", "portable-atomic/critical-section"]

[dependencies]
bytes = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
rand_core = { version = "0.10", default-features = false, optional = true }
tower = { version = "0.5", default-features = false, optional = true }
futures-core = { version = "0.3", default-features = false, optional = true }
portable-atomic = { version = "1", default-features = false, optional = true }

[dev-dependencies]
rand = "0.10"
tower = { version = "0.5", features = ["util", "limit"] }
futures = "0.3"
serde_json = "1"

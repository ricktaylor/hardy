services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hardy
      POSTGRES_PASSWORD: hardy
      POSTGRES_DB: hardy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardy"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket named by the command; `docker compose run --rm
  # rustfs-init <bucket>` creates another. Creating an existing bucket succeeds.
  rustfs-init:
    image: amazon/aws-cli:2.37.4
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["aws", "--endpoint-url", "http://rustfs:9000", "s3api", "create-bucket", "--bucket"]
    command: ["hardy-bundles"]

  hardy:
    build:
      context: .
      dockerfile: ./bpa-server/Dockerfile
      args:
        CARGO_ARGS: "--features hardy-bpa-server/sqlite-storage,hardy-bpa-server/postgres-storage,hardy-bpa-server/s3-storage"
    image: ghcr.io/ricktaylor/hardy/hardy-bpa-server:latest
    restart: unless-stopped
    command: ["-u"]
    environment:
      HARDY_BPA_SERVER_CONFIG_FILE: /etc/hardy/config.yaml
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
    ports:
      - "50051:50051"
      - "4556:4556"
    volumes:
      - ./bpa-server/config.yaml:/etc/hardy/config.yaml:ro
      - ./bpa-server/examples/keys.jwks:/etc/hardy/keys.jwks
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=127.0.0.1:50051"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  hardy-debug:
    profiles: ["debug"]
    build:
      context: .
      dockerfile: ./bpa-server/Dockerfile
    image: ghcr.io/ricktaylor/hardy/hardy-bpa-server:latest
    restart: unless-stopped
    environment:
      HARDY_BPA_SERVER_CONFIG_FILE: /etc/hardy/config.yaml
      # Env vars take precedence over config file
      HARDY_BPA_SERVER_LOG_LEVEL: debug
      HARDY_BPA_SERVER_STORAGE__METADATA__TYPE: memory
      HARDY_BPA_SERVER_STORAGE__BUNDLE__TYPE: memory
    ports:
      - "50051:50051"
      - "4556:4556"
    volumes:
      - ./bpa-server/config.yaml:/etc/hardy/config.yaml:ro
      - ./bpa-server/examples/keys.jwks:/etc/hardy/keys.jwks
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=127.0.0.1:50051"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  rustfs-data:


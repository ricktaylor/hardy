# The local IP address and port for the CLA to listen on for incoming
# connections. Default: [::]:4556, the IANA-registered TCPCL address.
#address = "[::]:4556"

# The Maximum Receive Unit (MRU) for a single TCP segment payload, in bytes.
# This defines the largest single block of data that can be received in one go.
#segment-mru = 16384

# The MRU for a total bundle transfer, in bytes.
# This is the largest bundle that can be received over this CLA.
#transfer-mru = 1073741824 # (1 GiB)

# The maximum number of idle incoming connections to keep open per remote IP address.
#max-idle-connections = 6

# The maximum number of transfers accepted but not yet resolved with an outcome, per peer (zero is rejected).
#max-outstanding-transfers = 16

# The maximum incoming connection rate (connections per second).
#connection-rate-limit = 64

# --- Default Session Parameters for TCPCLv4 ---
# These settings apply to all sessions unless overridden by a specific peer configuration.

# The time in seconds to wait for a CONTACT header from a connecting peer.
#contact-timeout = 15

# The interval in seconds for sending keepalive signals on an idle connection.
# A value of 0 disables keepalives.
#keepalive-interval = 60

# --- TLS (optional, plaintext if the [tls] section is absent) ---

# A trust anchor must be configured in this section.
#[tls]

# Refuse sessions that do not negotiate TLS.
#required = false

# Trust anchor: a directory of PEM CA certificates.
#ca-certs = "/etc/hardy/ca"

# Accept any certificate without validation (testing only, INSECURE).
# Overrides ca-certs when both are set (a startup warning names both keys),
# so a debug session is one line to flip.
#insecure-skip-verify = true

# Require dialers to present a certificate chaining to the ca-certs trust
# anchor (mutual TLS): "off", "optional" (verify a certificate when
# presented, accept dialers without one), or "required".
#client-auth = "off"

# SNI override presented when dialing (for certificates issued to domain names).
#server-name = "dtn.example.com"

# The node's own certificate and key, only ever configured together:
# required to accept TLS connections, presented to dialed peers under
# mutual TLS.
#[tls.identity]
#cert-file = "/etc/hardy/certs/server.crt"
#key-file = "/etc/hardy/private/server.key"

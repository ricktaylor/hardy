[package]
name = "hardy-otel"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["opentelemetry", "metrics", "tracing", "observability"]
categories = ["development-tools::profiling"]
exclude = ["docs/"]
description = "Logging and OpenTelemetry integration for Hardy DTN components"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
serde = ["dep:serde"]
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "dep:metrics",
    "dep:dashmap",
]

[dependencies]
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde = { version = "1", optional = true }
opentelemetry = { version = "0.33", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry_sdk = { version = "0.33", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "trace", "metrics", "logs", "internal-logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.33", optional = true }
opentelemetry-semantic-conventions = { version = "0.33", features = ["semconv_experimental"], optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
metrics = { version = "0.24", optional = true }
dashmap = { version = "6", optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

# The export harness drives `init`, which only exists with `otlp`.
[[test]]
name = "otel_export_test"
required-features = ["otlp"]

[package]
name = "hardy-qbcl"
description = "A Qubicle (DTN QUIC) convergence layer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dtn", "bpv7", "quic", "qubicle", "convergence-layer"]
categories = ["network-programming"]
exclude = ["docs/"]

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
bytes = "1"
hardy-async = { version = "0.2", path = "../async" }
hardy-bpa = { version = "0.2", path = "../bpa" }
hardy-bpv7 = { version = "0.6", path = "../bpv7" }
hardy-btpu = { version = "0.1", path = "../btpu", features = ["rand"] }
quinn = { version = "0.11", default-features = false, features = ["bloom", "runtime-tokio", "rustls-aws-lc-rs"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = { version = "0.1", default-features = false }
x509-parser = "0.18"

[dev-dependencies]
hardy-cbor = { version = "2", path = "../cbor" }
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
